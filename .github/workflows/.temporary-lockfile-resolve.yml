name: Temporary lockfile resolve

on:
  push:
    branches:
      - security/next-react-patches-20261015

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned dependency lock using npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit resolved lockfile for repository update
        run: |
          echo 'LOCK_BEGIN'
          base64 -w 2000 package-lock.json | sed 's/^/LOCK_CHUNK:/'
          echo 'LOCK_END'
