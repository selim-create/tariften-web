name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Pilot voice command regression tests
        run: node --test scripts/check-pilot-commands.test.cjs
      - name: Grounded recipe text import web contract tests (no AI calls)
        run: node --test scripts/check-recipe-text-import.test.cjs
      - name: Lokma food emoji and editorial import regression tests
        run: node --test scripts/check-lokma-emoji.test.cjs
      - name: Verified image upload filenames and JWT media routing
        run: node --test scripts/check-recipe-media-upload.test.cjs
      - name: Owner recipe edit moderation status and pending review UX
        run: node --test scripts/check-recipe-edit-review.test.cjs
      - name: Verify complete, accessible and guarded manual recipe creation
        run: node --test scripts/check-web-manual-recipe-studio.test.cjs
      - name: Quick AI candidate review and explicit publish contract
        run: node --test scripts/check-quick-ai-review.test.cjs
      - name: Guard shared recipe editor UX, curated units and numeric ranges
        run: node --test scripts/check-recipe-editor-parity-ux.test.cjs
      - name: Protect recipe edits and support existing Turkish ingredient amounts
        run: node --test scripts/check-legacy-ingredient-edit-auth.test.cjs
      - name: User review notes, feedback toast, stable AI modal and same-origin recipe writes
        run: node --test scripts/check-recipe-flow-notifications.test.cjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Verify Web owner-only Tariflerim Sofralarım and global create parity
        run: node --test scripts/check-web-my-kitchen.test.cjs
      - name: Quick recipe/pantry UX and profile-only quota displays
        run: node --test scripts/check-quick-create-quota-ux.test.cjs
